pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      exclude: 'semantier-runtime/**' # Generated parent-owned snapshot; preserve exact bytes.
      run: ruff check --config ./ruff.pre-commit.toml {staged_files}

    - name: verify parent composition
      glob: 'semantier-runtime/**'
      run: python3 scripts/bundles/parent_composition.py semantier-runtime

    - name: lint web
      root: web/
      glob: "web/**/*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint bootstrap installer
      root: apps/bootstrap-installer/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint desktop app
      root: apps/desktop/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}
