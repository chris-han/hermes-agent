# .github/workflows/typecheck.yml
name: Typecheck

on:
  workflow_call:

jobs:
  typecheck:
    name: Check TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: web
            script: typecheck
      fail-fast: false # report all failures, not just the first one
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # --ignore-scripts: typecheck only needs the TS sources + type defs, not
      # native builds. Skipping install scripts drops node-pty's node-gyp
      # header fetch. Use install instead of ci because some package locks lag
      # package.json in this branch and ci fails before tsc can run.
      - uses: ./.github/actions/retry
        with:
          command: npm install --ignore-scripts
          working-directory: ${{ matrix.package }}
      - run: npm run ${{ matrix.script }}
        working-directory: ${{ matrix.package }}
