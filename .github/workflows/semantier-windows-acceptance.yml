name: Semantier Windows acceptance
on:
  workflow_dispatch:
    inputs:
      controller_commit:
        description: Reviewed exact semantier-runtime controller commit
        required: true
        type: string
      package_layout:
        description: Native asset graph remains subject to graph and remote-digest qualification
        required: true
        default: legacy
        type: choice
        options: [legacy, native-assets]
      previous_native_layout:
        description: Retained qualified native A layout-plan.json Windows path for stable B assignment
        required: false
        type: string
env:
  ACCEPTANCE_CI_SID: ${{ vars.SEMANTIER_ACCEPTANCE_CI_SID }}
  ACCEPTANCE_PACKAGE_LAYOUT: ${{ inputs.package_layout || 'legacy' }}
  ACCEPTANCE_PUBLIC_BASE: 'https://updates.semantier.com'
  ACCEPTANCE_PREVIOUS_NATIVE_LAYOUT: ${{ inputs.previous_native_layout }}
  ACCEPTANCE_WINDOWS_PYTHON: 'D:\repo\qualification-private\windows-profile-c10-20261028-v1\package\app\resources\agent-payload\tools\python-3.14.7+20260901-win32-x64\python.exe'
  ACCEPTANCE_INCOMING_ROOT: ${{ vars.SEMANTIER_ACCEPTANCE_INCOMING_ROOT }}
  ACCEPTANCE_CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
permissions:
  contents: read
concurrency:
  group: semantier-windows-owned-signing
  cancel-in-progress: false
jobs:
  windows-x64:
    # A dedicated WSL runner on the authorized Windows host, never a public PR.
    runs-on: [semantier-windows-signing-bridge]
    environment: semantier-acceptance
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          path: hermes
          # The Windows controller transfers a Git bundle, which needs complete ancestry.
          fetch-depth: 0
      - name: Validate frozen controller reference
        env:
          CONTROLLER_COMMIT: ${{ env.ACCEPTANCE_CONTROLLER_COMMIT }}
        run: '[[ "$CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: chris-han/semantier-runtime
          ssh-key: ${{ secrets.SEMANTIER_CONTROLLER_SSH_KEY }}
          ref: ${{ env.ACCEPTANCE_CONTROLLER_COMMIT }}
          persist-credentials: false
          path: controller
      - name: Resolve retained Python for CI helpers
        shell: bash
        run: |
          set -euo pipefail
          ci_python="$(uv python find --offline --managed-python 3.14)"
          "$ci_python" -c 'import sys; assert sys.version_info >= (3, 11); print(sys.version)'
          echo "SEMANTIER_CI_PYTHON=$ci_python" >> "$GITHUB_ENV"
      - name: Run owned CI qualification
        shell: bash
        env:
          SEMANTIER_CLIENT_RECEIPT_KEY: ${{ secrets.SEMANTIER_CLIENT_RECEIPT_KEY }}
        run: |
          set -euo pipefail
          "$SEMANTIER_CI_PYTHON" hermes/scripts/releases/semantier_native_ci.py --orchestrate --expected-sid "$ACCEPTANCE_CI_SID" --incoming "$ACCEPTANCE_INCOMING_ROOT" --controller "$PWD/controller" --controller-commit "$ACCEPTANCE_CONTROLLER_COMMIT" --public-base "$ACCEPTANCE_PUBLIC_BASE"
