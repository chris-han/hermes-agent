name: Semantier Windows acceptance
on:
  push:
    branches: [staging/client-release-feedback-mvl-v1]
  workflow_dispatch:
    inputs:
      controller_commit:
        description: Reviewed exact semantier-runtime controller commit
        required: true
        type: string
      package_layout:
        description: Native asset graph remains subject to graph and remote-digest qualification
        required: true
        default: legacy
        type: choice
        options: [legacy, native-assets]
      previous_native_layout:
        description: Retained qualified native A layout-plan.json Windows path for stable B assignment
        required: false
        type: string
env:
  ACCEPTANCE_CI_SID: ${{ vars.SEMANTIER_ACCEPTANCE_CI_SID }}
  ACCEPTANCE_PACKAGE_LAYOUT: ${{ inputs.package_layout || 'legacy' }}
  ACCEPTANCE_PREVIOUS_NATIVE_LAYOUT: ${{ inputs.previous_native_layout }}
  ACCEPTANCE_WINDOWS_PYTHON: 'D:\repo\qualification-private\windows-profile-c10-20261028-v1\package\app\resources\agent-payload\tools\python-3.14.7+20260901-win32-x64\python.exe'
  ACCEPTANCE_INCOMING_ROOT: ${{ vars.SEMANTIER_ACCEPTANCE_INCOMING_ROOT }}
  ACCEPTANCE_CONTROLLER_COMMIT: ${{ inputs.controller_commit || 'e8bb2a8ec7095144dbf3692413b572424acd7521' }}
permissions:
  contents: read
concurrency:
  group: semantier-windows-owned-signing
  cancel-in-progress: false
jobs:
  windows-x64:
    # A dedicated WSL runner on the authorized Windows host, never a public PR.
    runs-on: [semantier-windows-signing-bridge]
    environment: semantier-acceptance
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          path: hermes
          # The Windows controller transfers a Git bundle, which needs complete ancestry.
          fetch-depth: 0
      - name: Validate frozen controller reference
        env:
          CONTROLLER_COMMIT: ${{ env.ACCEPTANCE_CONTROLLER_COMMIT }}
        run: '[[ "$CONTROLLER_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: chris-han/semantier-runtime
          ssh-key: ${{ secrets.SEMANTIER_CONTROLLER_SSH_KEY }}
          ref: ${{ env.ACCEPTANCE_CONTROLLER_COMMIT }}
          persist-credentials: false
          path: controller
      - name: Resolve retained Python for CI helpers
        shell: bash
        run: |
          set -euo pipefail
          ci_python="$(uv python find --offline --managed-python 3.14)"
          "$ci_python" -c 'import sys; assert sys.version_info >= (3, 11); print(sys.version)'
          echo "SEMANTIER_CI_PYTHON=$ci_python" >> "$GITHUB_ENV"
      - name: Build and sign with existing non-exportable identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCEPTANCE_CI_SID" =~ ^S-1-5-21-[0-9-]+$ ]]
          test -n "$ACCEPTANCE_INCOMING_ROOT"
          test -d "$ACCEPTANCE_INCOMING_ROOT"
          test -w "$ACCEPTANCE_INCOMING_ROOT"
          test ! -L "$ACCEPTANCE_INCOMING_ROOT"
          output="D:\\repo\\deliverables\\SemantierAgent-client-feedback-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ACCEPTANCE_OUTPUT=$(wslpath -u "$output")" >> "$GITHUB_ENV"
          native_args=()
          if [[ "$ACCEPTANCE_PACKAGE_LAYOUT" == native-assets ]]; then
            native_args+=(--native-assets --python "$ACCEPTANCE_WINDOWS_PYTHON")
            if [[ -n "$ACCEPTANCE_PREVIOUS_NATIVE_LAYOUT" ]]; then
              native_args+=(--previous-native-layout "$ACCEPTANCE_PREVIOUS_NATIVE_LAYOUT")
            fi
          elif [[ "$ACCEPTANCE_PACKAGE_LAYOUT" != legacy || -n "$ACCEPTANCE_PREVIOUS_NATIVE_LAYOUT" ]]; then
            exit 1
          fi
          "$SEMANTIER_CI_PYTHON" controller/scripts/build_hermes_windows.py --source "$PWD/hermes" --output "$output" --thumbprint 57BF15739B4AA447842EAF388856A01B4E5029FF --acceptance-public-base http://127.0.0.1:8926 "${native_args[@]}"
      - name: Real native installation and controlled inference-boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          root="D:\\repo\\qualification-private\\client-feedback-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ACCEPTANCE_NATIVE=$(wslpath -u "$root")/out" >> "$GITHUB_ENV"
          "$SEMANTIER_CI_PYTHON" hermes/scripts/releases/semantier_native_ci.py --output "$ACCEPTANCE_OUTPUT" --work "$root" --commit "$GITHUB_SHA" --expected-sid "$ACCEPTANCE_CI_SID"
      - name: Stage receipt-bound candidate; never promote
        shell: bash
        env:
          SEMANTIER_CLIENT_RECEIPT_KEY: ${{ secrets.SEMANTIER_CLIENT_RECEIPT_KEY }}
        run: |
          set -euo pipefail
          "$SEMANTIER_CI_PYTHON" hermes/scripts/releases/semantier_candidate.py --output "$ACCEPTANCE_OUTPUT" --native "$ACCEPTANCE_NATIVE" --incoming "$ACCEPTANCE_INCOMING_ROOT" --notes hermes/scripts/releases/semantier-acceptance-notes.json
