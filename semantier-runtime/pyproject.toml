[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"pyyaml>=6",
	"pydantic>=2",
	"fastapi>=0.115",
	"httpx>=0.27",
	"jsonschema>=4.23",
	"uvicorn>=0.35",
	"hermes-agent[feishu]",
	# Hermes intentionally omits application dependencies below its managed
	# Python 3.14 to keep old updaters lean. Semantier also hosts its source
	# APIs on Python 3.12; declare that boundary's tested runtime requirements.
	# Keep these pins aligned with the selected Hermes revision.
	"openai==2.24.0; python_version < '3.14'",
	"truststore==0.10.4; python_version < '3.14'",
	"python-dotenv==1.2.2; python_version < '3.14'",
	"fire==0.7.1; python_version < '3.14'",
	"rich==14.3.3; python_version < '3.14'",
	"tenacity==9.1.4; python_version < '3.14'",
	"tomli-w==1.2.0; python_version < '3.14'",
	"ruamel.yaml==0.18.16; python_version < '3.14'",
	"requests==2.33.0; python_version < '3.14'",
	"jinja2==3.1.6; python_version < '3.14'",
	"prompt_toolkit==3.0.52; python_version < '3.14'",
	"croniter==6.0.0; python_version < '3.14'",
	"snowballstemmer==3.1.1; python_version < '3.14'",
	"Markdown==3.10.2; python_version < '3.14'",
	"PyJWT[crypto]==2.13.0; python_version < '3.14'",
	"cryptography==50.0.1; python_version < '3.14'",
	"psutil==7.2.2; python_version < '3.14' and sys_platform != 'android'",
	"websockets==15.0.1; python_version < '3.14'",
	"python-multipart>=0.0.27",
	"duckdb>=1.5.6",
	"argon2-cffi>=23.1.0",
	"xlrd>=2.0.2",
	"charset-normalizer>=3.4.7",
	"aiohttp>=3.9",
	"scipy>=1.13.1",
	"networkx>=2.8.0",
	"rdflib>=7.0.0",
	"pyshacl==0.40.1",
	"pandas>=2.2",
	"openpyxl>=3.1",
	"pymupdf==1.28.2",
]

[project.optional-dependencies]
model-gateway = ["psycopg[binary]==3.3.3", "cryptography==50.0.1"]
dev = ["pytest>=9", "pytest-asyncio==1.3.0", "httpx>=0.27", "aiohttp>=3.9", "jsonschema>=4.23"]
knowledge-phase1 = [
    "falkordb>=1.0.0",
    "falkordblite>=0.1.0",
    "rdflib>=7.0.0",
]
knowledge-langextract = [
    "langextract>=1.2,<2",
]
document-ingestion-eval = [
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "pymupdf4llm==1.28.2",
    "docling==2.130.0",
]
etl-polars = [
    "polars==1.41.2",
]
source-text-query = [
    "pyoxigraph==0.5.11",
]

[tool.uv.sources]
hermes-agent = { path = "hermes-agent", editable = true }

[tool.hatch.build.targets.wheel]
sources = {"src" = ""}

[project.scripts]
semantier = "agents.launcher:run_hermes_cli"
semantier-api = "agents.launcher:run_api"
semantier-agent = "agents.launcher:run_agent_cli"
semantier-gateway = "agents.launcher:run_gateway_cli"
semantier-industry-sim = "agents.launcher:run_industry_sim"

[tool.pytest.ini_options]
pythonpath = ["src", "hermes-agent"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pillow>=12.3.0",
    "pytest>=9.0.3",
    "ruff==0.15.10",
]
