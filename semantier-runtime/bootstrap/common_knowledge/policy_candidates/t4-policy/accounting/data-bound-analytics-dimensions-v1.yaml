content:
  policy_id: data-bound-analytics-dimensions-v1
  version: 1
  authority_domain: accounting
  law_number: 5
  rule: >
    Data-bound analytics dimensions, buckets, periods, and pivots must be
    derived from governed datasets or explicit governed policy artifacts, not
    hard-coded in runtime SQL or plugin code.
  requirements:
    - Analytics period and year columns must be derived from source data.
    - Runtime-owned machine identifiers must remain ASCII-stable.
    - Localized labels for derived fields must live in governed metadata or schema-label catalogs.
  source_refs:
    - source_ref: docs/canonical/architecture.md
      authority_role: canonical_runtime_contract
